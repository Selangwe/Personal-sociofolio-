<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      This file exists only so Netlify can detect the site's forms at build time.
      The App Router renders the real forms on the client, where Netlify's build-time
      HTML parser cannot see them. Every field posted from lib/lead-capture.ts must
      have a matching input here, or that field is silently dropped from submissions.
      Not linked from anywhere and marked noindex — visitors never see this page.
    -->

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>

    <form name="resource-download" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="resource-download" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="resource" />
    </form>
  </body>
</html>
